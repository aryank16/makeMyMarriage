<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MakeMyMarriage — Set Up Your Wedding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bone: '#FAF7F2',
            surface: '#FFFFFF',
            inset: '#F4EFE8',
            primaryText: '#1A1613',
            secondaryText: '#6B625A',
            divider: '#E4DCD1',
            terracotta: '#A1472F',
            terracottaHover: '#8A3B26',
            emerald: '#1F4D42',
          },
          fontFamily: {
            serif: ['"Instrument Serif"', 'serif'],
            sans: ['"Inter"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #FAF7F2;
      color: #1A1613;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      opacity: 0.55;
      cursor: pointer;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[#FAF7F2] text-[#1A1613]">

  <!-- Top bar with brand logo & wordmark -->
  <header class="w-full border-b border-[#E4DCD1] bg-[#FAF7F2] py-4 px-8">
    <div class="max-w-[1200px] mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <img src="https://lh3.googleusercontent.com/aida/AEtjO1WGsk3VUmANBY7Ldnxu-jRgvB4AeDHsdHab6ZxNKYBuYy6JKrwU3fa6l5YKIXSZ0Fc9yaDbRYdXilfHuf5fKVwSTndNib9BKTSpXBJu2Ve5Z4k9QjTP1MWWYJIO04itncsgWYll9iqkjVg9Gyg1Ce4vFoIy4iQUcpMGkA8NNFjPtpgp-Fznkvb0TQ37n9HKLsWwS7Vnt8jPcExcBhMmMTaFXsiMz-0WixTaqAf6pqM7Vbo52Dvac2yWxkzz" alt="MakeMyMarriage" class="w-6 h-6 object-contain" />
        <span class="font-serif text-[20px] tracking-tight text-[#1A1613]">MakeMyMarriage</span>
      </div>
    </div>
  </header>

  <!-- Main Centered Setup Card Container -->
  <main class="flex-1 flex flex-col items-center justify-center py-12 px-4 sm:px-6">
    <div class="w-full max-w-[640px] bg-white border border-[#E4DCD1] rounded-[10px] p-8 sm:p-10">

      <!-- Header Section -->
      <div class="mb-8">
        <h1 class="font-serif text-[40px] leading-[1.1] font-normal text-[#1A1613] tracking-tight">Set up your wedding</h1>
        <p class="text-[15px] text-[#6B625A] mt-2 font-normal">You can change all of this later.</p>
      </div>

      <form onsubmit="event.preventDefault();" class="space-y-6">

        <!-- Row 1: Bride's name & Groom's name -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="flex flex-col">
            <label for="bride-name" class="text-[14px] font-medium text-[#1A1613] mb-2">Bride’s name</label>
            <input 
              type="text" 
              id="bride-name" 
              placeholder="Ananya"
              class="h-[52px] w-full bg-white border border-[#E4DCD1] rounded-[10px] px-4 text-[16px] text-[#1A1613] placeholder-[#A8A29D] focus:outline-none focus:border-[#A1472F] transition-colors"
            />
          </div>

          <div class="flex flex-col">
            <label for="groom-name" class="text-[14px] font-medium text-[#1A1613] mb-2">Groom’s name</label>
            <input 
              type="text" 
              id="groom-name" 
              placeholder="Rohit"
              class="h-[52px] w-full bg-white border border-[#E4DCD1] rounded-[10px] px-4 text-[16px] text-[#1A1613] placeholder-[#A8A29D] focus:outline-none focus:border-[#A1472F] transition-colors"
            />
          </div>
        </div>

        <!-- Row 2: Wedding date & City -->
        <div class="space-y-1.5">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="flex flex-col">
              <label for="wedding-date" class="text-[14px] font-medium text-[#1A1613] mb-2">Wedding date</label>
              <input 
                type="date" 
                id="wedding-date" 
                class="h-[52px] w-full bg-white border border-[#E4DCD1] rounded-[10px] px-4 text-[16px] text-[#1A1613] focus:outline-none focus:border-[#A1472F] transition-colors"
              />
            </div>

            <div class="flex flex-col">
              <label for="city" class="text-[14px] font-medium text-[#1A1613] mb-2">City</label>
              <input 
                type="text" 
                id="city" 
                placeholder="Udaipur"
                class="h-[52px] w-full bg-white border border-[#E4DCD1] rounded-[10px] px-4 text-[16px] text-[#1A1613] placeholder-[#A8A29D] focus:outline-none focus:border-[#A1472F] transition-colors"
              />
            </div>
          </div>
          <p class="text-[13px] text-[#6B625A] pt-0.5">Leave the date blank if it is not fixed yet.</p>
        </div>

        <!-- Section: Your functions -->
        <div class="pt-2">
          <div class="mb-3">
            <label class="text-[14px] font-medium text-[#1A1613] block">Your functions</label>
            <p class="text-[13px] text-[#6B625A] mt-0.5">Dates are filled in automatically from the wedding day. You can adjust them afterwards.</p>
          </div>

          <!-- Two-column grid of eight selectable checkbox rows -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">

            <!-- 1. Roka / Engagement — unchecked -->
            <label class="function-card relative flex items-center justify-between p-3.5 bg-white border border-[#E4DCD1] rounded-[10px] cursor-pointer select-none transition-all hover:border-[#CFC3B3]">
              <div class="flex items-center gap-3">
                <input type="checkbox" class="sr-only function-checkbox" />
                <div class="checkbox-box w-[18px] h-[18px] rounded-[4px] border border-[#E4DCD1] flex items-center justify-center transition-colors">
                  <svg class="check-icon hidden w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </div>
                <span class="text-[14px] text-[#1A1613] font-normal">Roka / Engagement</span>
              </div>
              <span class="text-[12px] text-[#6B625A] tabular-nums font-normal">60d before</span>
            </label>

            <!-- 2. Mehendi — CHECKED -->
            <label class="function-card relative flex items-center justify-between p-3.5 bg-[#FAF7F2] border border-[#A1472F] rounded-[10px] cursor-pointer select-none transition-all">
              <div class="flex items-center gap-3">
                <input type="checkbox" checked class="sr-only function-checkbox" />
                <div class="checkbox-box w-[18px] h-[18px] rounded-[4px] bg-[#A1472F] border border-[#A1472F] flex items-center justify-center transition-colors">
                  <svg class="check-icon w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </div>
                <span class="text-[14px] text-[#1A1613] font-normal">Mehendi</span>
              </div>
              <span class="text-[12px] text-[#6B625A] tabular-nums font-normal">2d before</span>
            </label>

            <!-- 3. Haldi — CHECKED -->
            <label class="function-card relative flex items-center justify-between p-3.5 bg-[#FAF7F2] border border-[#A1472F] rounded-[10px] cursor-pointer select-none transition-all">
              <div class="flex items-center gap-3">
                <input type="checkbox" checked class="sr-only function-checkbox" />
                <div class="checkbox-box w-[18px] h-[18px] rounded-[4px] bg-[#A1472F] border border-[#A1472F] flex items-center justify-center transition-colors">
                  <svg class="check-icon w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </div>
                <span class="text-[14px] text-[#1A1613] font-normal">Haldi</span>
              </div>
              <span class="text-[12px] text-[#6B625A] tabular-nums font-normal">1d before</span>
            </label>

            <!-- 4. Sangeet — CHECKED -->
            <label class="function-card relative flex items-center justify-between p-3.5 bg-[#FAF7F2] border border-[#A1472F] rounded-[10px] cursor-pointer select-none transition-all">
              <div class="flex items-center gap-3">
                <input type="checkbox" checked class="sr-only function-checkbox" />
                <div class="checkbox-box w-[18px] h-[18px] rounded-[4px] bg-[#A1472F] border border-[#A1472F] flex items-center justify-center transition-colors">
                  <svg class="check-icon w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </div>
                <span class="text-[14px] text-[#1A1613] font-normal">Sangeet</span>
              </div>
              <span class="text-[12px] text-[#6B625A] tabular-nums font-normal">1d before</span>
            </label>

            <!-- 5. Baraat — unchecked -->
            <label class="function-card relative flex items-center justify-between p-3.5 bg-white border border-[#E4DCD1] rounded-[10px] cursor-pointer select-none transition-all hover:border-[#CFC3B3]">
              <div class="flex items-center gap-3">
                <input type="checkbox" class="sr-only function-checkbox" />
                <div class="checkbox-box w-[18px] h-[18px] rounded-[4px] border border-[#E4DCD1] flex items-center justify-center transition-colors">
                  <svg class="check-icon hidden w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </div>
                <span class="text-[14px] text-[#1A1613] font-normal">Baraat</span>
              </div>
              <span class="text-[12px] text-[#6B625A] tabular-nums font-normal">wedding day</span>
            </label>

            <!-- 6. Wedding ceremony — CHECKED -->
            <label class="function-card relative flex items-center justify-between p-3.5 bg-[#FAF7F2] border border-[#A1472F] rounded-[10px] cursor-pointer select-none transition-all">
              <div class="flex items-center gap-3">
                <input type="checkbox" checked class="sr-only function-checkbox" />
                <div class="checkbox-box w-[18px] h-[18px] rounded-[4px] bg-[#A1472F] border border-[#A1472F] flex items-center justify-center transition-colors">
                  <svg class="check-icon w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </div>
                <span class="text-[14px] text-[#1A1613] font-normal">Wedding ceremony</span>
              </div>
              <span class="text-[12px] text-[#6B625A] tabular-nums font-normal">wedding day</span>
            </label>

            <!-- 7. Vidaai — unchecked -->
            <label class="function-card relative flex items-center justify-between p-3.5 bg-white border border-[#E4DCD1] rounded-[10px] cursor-pointer select-none transition-all hover:border-[#CFC3B3]">
              <div class="flex items-center gap-3">
                <input type="checkbox" class="sr-only function-checkbox" />
                <div class="checkbox-box w-[18px] h-[18px] rounded-[4px] border border-[#E4DCD1] flex items-center justify-center transition-colors">
                  <svg class="check-icon hidden w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </div>
                <span class="text-[14px] text-[#1A1613] font-normal">Vidaai</span>
              </div>
              <span class="text-[12px] text-[#6B625A] tabular-nums font-normal">1d after</span>
            </label>

            <!-- 8. Reception — CHECKED -->
            <label class="function-card relative flex items-center justify-between p-3.5 bg-[#FAF7F2] border border-[#A1472F] rounded-[10px] cursor-pointer select-none transition-all">
              <div class="flex items-center gap-3">
                <input type="checkbox" checked class="sr-only function-checkbox" />
                <div class="checkbox-box w-[18px] h-[18px] rounded-[4px] bg-[#A1472F] border border-[#A1472F] flex items-center justify-center transition-colors">
                  <svg class="check-icon w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </div>
                <span class="text-[14px] text-[#1A1613] font-normal">Reception</span>
              </div>
              <span class="text-[12px] text-[#6B625A] tabular-nums font-normal">1d after</span>
            </label>

          </div>
        </div>

        <!-- Primary Submit Button -->
        <div class="pt-4">
          <button 
            type="submit" 
            class="w-full h-[52px] bg-[#A1472F] hover:bg-[#8A3B26] text-white font-medium text-[16px] rounded-[10px] transition-colors flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-[#A1472F]/30"
          >
            Create wedding
          </button>
        </div>

      </form>
    </div>
  </main>

  <script>
    // Simple toggle interaction for checkboxes to maintain state aesthetics dynamically
    document.querySelectorAll('.function-card').forEach(card => {
      const checkbox = card.querySelector('.function-checkbox');
      const box = card.querySelector('.checkbox-box');
      const icon = card.querySelector('.check-icon');

      checkbox.addEventListener('change', () => {
        if (checkbox.checked) {
          card.classList.remove('bg-white', 'border-[#E4DCD1]', 'hover:border-[#CFC3B3]');
          card.classList.add('bg-[#FAF7F2]', 'border-[#A1472F]');
          box.classList.remove('border-[#E4DCD1]');
          box.classList.add('bg-[#A1472F]', 'border-[#A1472F]');
          icon.classList.remove('hidden');
        } else {
          card.classList.add('bg-white', 'border-[#E4DCD1]', 'hover:border-[#CFC3B3]');
          card.classList.remove('bg-[#FAF7F2]', 'border-[#A1472F]');
          box.classList.add('border-[#E4DCD1]');
          box.classList.remove('bg-[#A1472F]', 'border-[#A1472F]');
          icon.classList.add('hidden');
        }
      });
    });
  </script>
</body>
</html>
